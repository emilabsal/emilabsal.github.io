<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Успешная отправка сообщения</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Rubik:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="sass/slick.css" />
    <link rel="stylesheet" href="sass/slick-theme.css" />
    <link rel="stylesheet" href="sass/style.css" />
  </head>
  <body>
    <div class="order success-order">
      <div class="order__inner">
        <svg
          class="order__close"
          width="44"
          height="44"
          viewBox="0 0 44 44"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M2 2L42 42M42 2L2 42" stroke="#1F4960" stroke-width="3" />
        </svg>
        <div class="success">
          <img src="icons/success.svg" alt="" />
          <span>Спасибо</span>
          <p>Ваша заявка успешно отправлена</p>
        </div>
      </div>
    </div>
  </body>
</html>
